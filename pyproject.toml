[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-agent"
version = "0.1.0"
description = "Autonomous chess agent with modular decision engine support"
authors = [{name = "Specify Team"}]
requires-python = ">=3.9"
dependencies = [
    "python-chess>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "pytest-mock>=3.6",
]

[tool.setuptools]
packages = ["chess_agent", "chess_agent.engines"]
